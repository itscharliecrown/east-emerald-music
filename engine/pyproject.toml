[project]
name = "ee-engine"
version = "0.0.1"
description = "East Emerald Sample Engine: loop/stem generation with Stable Audio 3"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "modal>=1.0",
    "anthropic>=0.50",
    "fal-client>=0.5",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.32",
    "pretty-midi>=0.2.11.post0",
]

# GPU deps (torch, flash-attn, stable-audio-3, beat_this, demucs) are installed only in the
# Modal image (see app.py). Never sync them locally: the dev Mac has no disk for them.

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
